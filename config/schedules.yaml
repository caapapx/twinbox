timezone: Asia/Shanghai
schedules:
  - name: daytime-sync
    cron: "0 12 * * *"
    job: daytime-sync
    command: "python3 -m twinbox_core.cli schedule run-due --json"
    description: "Daytime sync at 12:00 Asia/Shanghai"
  - name: nightly-full
    cron: "0 2 * * *"
    job: nightly-full
    command: "python3 -m twinbox_core.cli schedule run-due --json"
    description: "Nightly full rebuild at 02:00 Asia/Shanghai"
